services:
  postgres:
    image: postgres:16-alpine
    container_name: fitxai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitxai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-FitxaiSecret2026!}
      POSTGRES_DB: ${POSTGRES_DB:-fitxai_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitxai_user} -d ${POSTGRES_DB:-fitxai_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fitxai_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fitxai_user}:${POSTGRES_PASSWORD:-FitxaiSecret2026!}@postgres:5432/${POSTGRES_DB:-fitxai_prod}
      JWT_SECRET: ${JWT_SECRET:-super_secret_production_jwt_key_2026_fitxai_at_least_64_characters}
      JWT_EXPIRATION: 7d
      BCRYPT_ROUNDS: 12
      GPS_ACCURACY_THRESHOLD_METERS: 150
      GPS_MAX_ALLOWED_ACCURACY_METERS: 250
    ports:
      - "4000:4000"

volumes:
  pgdata:
